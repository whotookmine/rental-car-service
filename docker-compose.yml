services:
  db:
    image: postgres:16
    container_name: rental-car-service-db
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      POSTGRES_DB: rental_car_service
    ports:
      - "5433:5432"
    volumes:
      - rental_car_service_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental_car_service"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  rental_car_service_pgdata:
